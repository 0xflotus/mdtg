name: Documentation E2E Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://0xflotus.github.io/mdtg/

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm clean-install --prefix docs
      - name: Install Playwright browser [${{ matrix.browser }}]
        run: npm exec --prefix docs -- playwright install --with-deps ${{ matrix.browser }}
      - name: Run documentation tests
        run: BASE_URL=${{ env.BASE_URL }} npm run test:e2e --prefix docs -- --project=${{ matrix.browser }}
