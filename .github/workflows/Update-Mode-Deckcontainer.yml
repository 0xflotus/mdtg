name: Update devcontainer Node.js patch version

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target-branch: [main, test]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target-branch }}

      - name: Check for the latest Node.js patch version
        id: node
        shell: bash
        run: |
          set -euo pipefail

          file=".devcontainer/devcontainer.json"
          feature="ghcr.io/devcontainers/features/node:2"

          current=$(jq -r --arg feature "$feature" '.features[$feature].version' "$file")
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)

          latest=$(curl -fsSL https://nodejs.org/dist/index.json |
            jq -r --arg major "$major" --arg minor "$minor" '
              [.[] | select(.version | test("^v" + $major + "\\." + $minor + "\\."))]
              | map(.version | ltrimstr("v"))
              | sort_by(split(".") | map(tonumber))
              | last
            ')

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not find a Node.js version for $major.$minor.x."
            exit 1
          fi

          if [ "$current" = "$latest" ]; then
            echo "No new Node.js patch version is available for ${{ matrix.target-branch }}. Exiting successfully."
            echo "update_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Node.js patch update available on ${{ matrix.target-branch }}: $current -> $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          echo "update_required=true" >> "$GITHUB_OUTPUT"

      - name: Update devcontainer
        if: steps.node.outputs.update_required == 'true'
        env:
          NEW_VERSION: ${{ steps.node.outputs.version }}
        run: |
          file=".devcontainer/devcontainer.json"
          jq --arg version "$NEW_VERSION" '
            .features["ghcr.io/devcontainers/features/node:2"].version = $version
            | .name = ("mdtg - Node " + $version)
          ' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"

      - name: Create pull request
        if: steps.node.outputs.update_required == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ matrix.target-branch }}
          branch: automation/update-devcontainer-node-${{ matrix.target-branch }}
          title: "chore: update devcontainer Node.js patch version"
          commit-message: "chore: update devcontainer Node.js patch version"
          body: "Updates Node.js in the devcontainer to the latest patch version within the current major and minor version."
