name: k6 Test

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/k6.yml
      - docs/k6/docs-test.js
  workflow_dispatch:
  schedule:
    - cron: "0 8 */2 * *"

jobs:
  docs-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: "2.4.0"
      - name: Run Test
        uses: grafana/run-k6-action@54385d2a25c222a08b4a3aec6b653b8fb370a1ed # 1.6.0
        with:
          path: docs/k6/docs-test.js
