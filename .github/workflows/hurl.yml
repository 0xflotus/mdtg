name: Hurl Tests

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Berlin"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hurl:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Hurl
        run: brew install hurl
      - name: Verify Hurl installation
        run: hurl --version
      - name: Run Hurl tests
        run: hurl --test docs/hurl/*.hurl
