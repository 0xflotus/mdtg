name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    name: Test packed package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Pack package
        id: pack
        run: echo "tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"
      - name: Install packed package and integration tests
        run: |
          npm install "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}" --prefix "$RUNNER_TEMP/mdtg-integration"
          printf '{ "type": "module" }\n' > "$RUNNER_TEMP/mdtg-integration/package.json"
          mkdir -p "$RUNNER_TEMP/mdtg-integration/test"
          cp -R test/integration "$RUNNER_TEMP/mdtg-integration/test/integration"
      - name: Run integration tests against packed package
        run: npx vitest run --root "$RUNNER_TEMP/mdtg-integration" --config "$GITHUB_WORKSPACE/vitest.config.js" --project integration
