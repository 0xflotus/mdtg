version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    target-branch: "main"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:03"
      timezone: "Europe/Berlin"
    target-branch: "develop"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:15"
      timezone: "Europe/Berlin"
    labels:
      - "github_actions"
    open-pull-requests-limit: 5
