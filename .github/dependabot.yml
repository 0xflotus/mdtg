version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 1
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      stryker:
        patterns:
          - "@systemfsoftware/*"
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    cooldown:
      default-days: 1
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
      docusaurus:
        patterns:
          - "@docusaurus/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:15"
      timezone: "Europe/Berlin"
    labels:
      - "github_actions"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/docs"
    schedule:
      interval: "daily"
      time: "08:30"
      timezone: "Europe/Berlin"
    labels:
      - "docker"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore"
      include: "scope"
